name: Build Android APK
on:
  push:
    tags:
      - 'v*'
    branches:
      - feat/local-media-editors
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android SDK on GitHub runner
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Build with Capacitor
        run: |
          cd capacitor-wrapper
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Check output and copy
        run: |
          APK=$(find capacitor-wrapper/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          test "$(stat -c%s "$APK")" -gt 5242880
          mkdir -p dist
          cp "$APK" dist/capcut-studio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: capcut-studio-apk
          path: dist/capcut-studio-debug.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/capcut-studio-debug.apk --generate-notes
      - name: Publish unmerged preview release
        if: github.ref == 'refs/heads/feat/local-media-editors'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-preview-${GITHUB_SHA:0:7}"
          gh release create "$TAG" dist/capcut-studio-debug.apk --target "$GITHUB_SHA" --prerelease --title "Capcut Studio preview $TAG" --notes "Unmerged evaluation build. Not verified; no changes to main."