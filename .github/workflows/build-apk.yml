name: Build Android APK
on:
  push:
    tags:
      - 'v*'
    branches:
      - feat/local-media-editors
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Check Android SDK on GitHub runner
        run: |
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Build with Capacitor
        run: |
          cd capacitor-wrapper
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew assembleDebug --no-daemon --max-workers=2; then
              exit 0
            fi
            echo "::warning::Gradle build attempt $attempt failed (Maven rate limiting possible)."
            sleep $((attempt * 25))
          done
          exit 1
      - name: Check output and copy
        run: |
          find capacitor-wrapper/android/app/build/outputs/apk -name '*.apk' -printf '%p %s bytes\\n'
          APK=$(find capacitor-wrapper/android/app/build/outputs/apk -name '*.apk' -print -quit)
          test -n "$APK"
          BYTES=$(stat -c%s "$APK")
          echo "APK size: $BYTES bytes"
          if [ "$BYTES" -le 5242880 ]; then echo "::error::APK must exceed 5 MiB, got $BYTES bytes"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/capcut-studio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: capcut-studio-apk
          path: dist/capcut-studio-debug.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/capcut-studio-debug.apk --generate-notes
      - name: Publish unmerged preview release
        if: github.ref == 'refs/heads/feat/local-media-editors'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-preview-${GITHUB_SHA:0:7}"
          if ! gh release create "$TAG" dist/capcut-studio-debug.apk --target "$GITHUB_SHA" --prerelease --title "Capcut Studio preview $TAG" --notes "Build from feature branch"; then
            echo "::warning::GitHub Release creation unavailable with current workflow token; downloadable APK artifact is uploaded above."
          fi
      - name: Publish main Android Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.0-main-${GITHUB_SHA:0:7}"
          if ! gh release create "$TAG" dist/capcut-studio-debug.apk --target "$GITHUB_SHA" --latest --title "Capcut Studio Android $TAG" --notes "Built from main: FFmpeg.wasm and Capacitor APK; debug signed, not Play Store release."; then
            echo "::warning::GitHub Release creation unavailable with current workflow token; downloadable APK artifact is uploaded above."
          fi
